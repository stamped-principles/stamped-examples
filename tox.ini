[tox]
envlist = snippets,hugo

[testenv:snippets]
skip_install = true
deps = -r requirements-test.txt
# datalad is needed at runtime but its pytest plugin breaks sybil collection
commands = pytest -v -p no:datalad {posargs:content/ tests/test_pixi_stellar_verification.py}

[testenv:hugo]
skip_install = true
allowlist_externals =
    hugo
    sh
commands =
    sh scripts/load_example_data
    hugo --gc --minify

[testenv:materialize]
skip_install = true
deps = -r requirements-test.txt
allowlist_externals = python3
commands = python3 scripts/materialize_examples {posargs}

[testenv:rematerialize]
skip_install = true
deps = -r requirements-test.txt
allowlist_externals = python3
commands =
    python3 scripts/dematerialize_examples
    python3 scripts/materialize_examples {posargs}

[testenv:reuse]
skip_install = true
deps = reuse
description = Check REUSE specification compliance
commands = reuse lint
